name: Upload video to YouTube

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Channel label (hidden-history-files, oldgold, story-atlas, past-present, tech-atlas)"
        required: true
      video_url_enc:
        description: "Fernet-encrypted direct download URL of the MP4 (encrypt with YT_URL_KEY)"
        required: true
      title:
        description: "Video title"
        required: true
      description:
        description: "Video description"
        required: true
      tags:
        description: "Comma-separated tags"
        required: false
        default: ""
      thumbnail_url_enc:
        description: "Fernet-encrypted direct download URL of the thumbnail PNG (encrypt with YT_URL_KEY)"
        required: false
        default: ""
      privacy:
        description: "Initial privacy"
        required: false
        default: "unlisted"

# One upload per channel at a time; queue the rest.
concurrency:
  group: yt-upload-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Decrypt download URLs
        # Decrypts the Fernet-encrypted inputs into env vars. Nothing is echoed;
        # decrypted values are masked so they can never appear in logs.
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os
          from cryptography.fernet import Fernet
          f = Fernet(os.environ["YT_URL_KEY"].encode())
          video_url = f.decrypt(os.environ["VIDEO_URL_ENC"].encode()).decode()
          thumb_url = f.decrypt(os.environ["THUMB_URL_ENC"].encode()).decode() if os.environ.get("THUMB_URL_ENC") else ""
          # Mask decrypted values before they touch the environment.
          print("::add-mask::%s" % video_url)
          if thumb_url:
              print("::add-mask::%s" % thumb_url)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("VIDEO_URL=%s\n" % video_url)
              fh.write("THUMB_URL=%s\n" % thumb_url)
          print("urls decrypted")
          EOF
        env:
          VIDEO_URL_ENC: ${{ inputs.video_url_enc }}
          THUMB_URL_ENC: ${{ inputs.thumbnail_url_enc }}
          YT_URL_KEY: ${{ secrets.YT_URL_KEY }}
      - name: Download video and thumbnail
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o video.mp4 "$VIDEO_URL"
          if [ -n "$THUMB_URL" ]; then
            curl -fSL --retry 3 -o thumb.png "$THUMB_URL" || true
          fi
          ls -la video.mp4
      - name: Upload to YouTube
        run: |
          set -euo pipefail
          ARGS=(--label "$LABEL" --video video.mp4 --title "$TITLE"
                --description "$DESCRIPTION" --tags "$TAGS" --privacy "$PRIVACY")
          [ -f thumb.png ] && ARGS+=(--thumbnail thumb.png)
          python3 scripts/yt_upload.py "${ARGS[@]}"
        env:
          LABEL: ${{ inputs.label }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          TAGS: ${{ inputs.tags }}
          PRIVACY: ${{ inputs.privacy }}
          YT_CLIENTS_JSON: ${{ secrets.YT_CLIENTS_JSON }}
          YT_TOKENS_JSON: ${{ secrets.YT_TOKENS_JSON }}
